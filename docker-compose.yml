# Local infrastructure for SmartEstate.
# The ML service runs here because it is a deployable in its own right. The API
# and the web app still run from the workspace with `pnpm dev` in development.
#
#   pnpm docker:up      start (builds the Postgres image on first run) and wait for health
#   pnpm docker:down    stop, keep data
#   pnpm docker:reset   stop, DELETE data volumes, start fresh
name: smartestate

services:
  postgres:
    build:
      context: ./docker/postgres
    image: smartestate/postgres:16-postgis-pgvector
    container_name: smartestate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartestate}
      POSTGRES_DB: ${POSTGRES_DB:-smartestate}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first initialisation of an empty data volume.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: smartestate-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  ml:
    build:
      context: ./apps/ml
      target: runtime
    image: smartestate/ml:0.2.0
    container_name: smartestate-ml
    restart: unless-stopped
    # No database and no secrets: the service is handed features over HTTP and
    # answers with a valuation. Training is a separate image and a separate,
    # manual step, so nothing here needs a connection string.
    environment:
      ML_LOG_LEVEL: ${ML_LOG_LEVEL:-info}
    ports:
      - '${ML_PORT:-8000}:8000'

volumes:
  postgres-data:
  redis-data:
